# =============================================================
# ResQAI - Prometheus Configuration
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'resqai-monitor'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ---- ResQAI Backend ----
  - job_name: 'resqai-backend'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scheme: 'http'

  # ---- PostgreSQL ----
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ---- Redis ----
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ---- Kafka ----
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ---- Nginx ----
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # ---- Celery Workers ----
  - job_name: 'celery'
    static_configs:
      - targets: ['celery_flower:5555']
    metrics_path: '/metrics'

  # ---- Node Exporter (Host Metrics) ----
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
